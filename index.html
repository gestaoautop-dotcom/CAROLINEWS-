<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mudra | Portfolio</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome (ícones sociais e mouse) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- Google Font: Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Seu CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= NAVBAR ================= -->
  <nav class="navbar navbar-expand-lg fixed-top custom-nav sticky">
    <div class="container">
      <a class="navbar-brand logo" href="#home">CWS</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarCollapse" aria-controls="navbarCollapse"
              aria-expanded="false" aria-label="Abrir menu">
        <i class="fa-solid fa-bars"></i>
      </button>

      <div class="collapse navbar-collapse" id="navbarCollapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item active">
            <a href="#home" class="nav-link">Home</a>
          </li>
          <li class="nav-item">
            <a href="#about" class="nav-link">About</a>
          </li>
          <li class="nav-item">
            <a href="#services" class="nav-link">Services</a>
          </li>
          <li class="nav-item">
            <a href="#portfolio" class="nav-link">Portfolio</a>
          </li>
          <li class="nav-item">
            <a href="#achievements" class="nav-link">Achievements</a>
          </li>
          <li class="nav-item">
            <a href="#blog" class="nav-link">Blog</a>
          </li>
          <li class="nav-item">
            <a href="#contact" class="nav-link">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ================= HERO / HOME ================= -->
  <section class="home" id="home">
    <div class="home-overlay"></div>

    <div class="container">
      <div class="home-content text-center">
        <h5 class="home-subtitle">Hello &amp; Welcome</h5>

        <h1 class="home-title">
          I Am <strong><span id="typed-text"></span></strong><span class="cursor" aria-hidden="true"></span>
        </h1>

        <ul class="social-list list-inline">
          <li class="list-inline-item"><a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a></li>
          <li class="list-inline-item"><a href="#" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a></li>
          <li class="list-inline-item"><a href="#" aria-label="Pinterest"><i class="fa-brands fa-pinterest"></i></a></li>
          <li class="list-inline-item"><a href="#" aria-label="Google+"><i class="fa-brands fa-google-plus-g"></i></a></li>
          <li class="list-inline-item"><a href="#" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a></li>
        </ul>

        <a href="#" class="btn btn-outline-light btn-cv" download>Download CV</a>
      </div>
    </div>

    <!-- Indicador de scroll (mouse) -->
    <a href="#about" class="scroll-down" aria-label="Rolar para a próxima seção">
      <span class="mouse"><span class="wheel"></span></span>
    </a>
  </section>

  <!-- Seção de exemplo para o scroll/âncoras funcionarem -->
  <section id="about" class="placeholder-section">
    <div class="container">
      <h2>About</h2>
      <p>Próxima seção do portfólio.</p>
    </div>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Seu JS -->
  <script src="script.js"></script>
